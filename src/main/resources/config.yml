prefix: "&8[&cAntiDupe&8] "

settings:
  # Saniyede izin verilen maksimum envanter tıklaması (modlu/paket dupeleri için)
  max-clicks-per-second: 40
  # Bu kadar ihlalden sonra envanter zorla kapatılır
  violations-before-close: 5
  # Container açıkken tıklamadan kaç tick sonra envanter taransın
  scan-delay-ticks: 5
  # Her X saniyede tüm oyuncuları tara (0 = kapalı)
  periodic-scan-seconds: 60
  # İki oyuncuda aynı eşya kimliği varsa (doğrulanmış) kopyayı karantinaya al
  cross-player-detection: true
  # Creative oyuncular container (sandık, shulker vb.) kullanamasın
  block-creative-containers: true
  # Mod kanalı kaydeden istemciler: FLAG (sıkı denetim) veya KICK
  modded-client-action: FLAG
  modded-channel-prefixes: ["fml", "forge", "fabric", "neoforge", "quilt"]
  # Container açıkken engellenecek komutlar
  blocked-commands-while-container-open: ["ec", "enderchest", "echest", "pv", "vault", "chest"]
  # Takip dışı bırakılacak materyaller (örn. "ELYTRA")
  ignored-materials: []
  # Karantina kayıtları kaç gün sonra silinsin (sadece geri verilmiş olanlar)
  quarantine-retention-days: 30

